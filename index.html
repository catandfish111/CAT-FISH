<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="theme-color" content="#8bd9f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<meta name="description" content="小鱼和小猫的情侣空间">
<meta property="og:title" content="小鱼和小猫的情侣空间">
<meta property="og:description" content="把喜欢的每一天，慢慢收集起来。">
<title>小鱼和小猫的情侣空间</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="stage" data-phase="space">

  <!-- 背景：暖色光晕 + 爱心粒子（canvas） -->
  <canvas id="fx" class="fx" aria-hidden="true"></canvas>

  <!-- 空间页背景：云朵壁纸（电脑用横屏版、手机用竖屏版，由 CSS 媒体查询自动切换） -->
  <div class="space-bg-img" aria-hidden="true"></div>
  <div class="space-bg-scrim" aria-hidden="true"></div>

  <div class="vignette" aria-hidden="true"></div>

  <!-- 情侣空间首页：信封只是其中一个入口，其他模块可以继续扩展。 -->
  <section class="space-home" id="spaceHome" aria-label="情侣空间首页">
    <header class="space-topbar">
      <div class="space-brand"><span class="space-brand-mark">♡</span><span>我们的空间</span></div>
      <button class="space-menu" id="spaceMenu" type="button" aria-label="空间设置" title="空间设置">
        <span></span><span></span><span></span>
      </button>
    </header>
    <main class="space-content">
      <section class="space-hero" aria-labelledby="spaceTitle">
        <p class="space-eyebrow">小鱼和小猫 · 一直在一起</p>
        <h1 id="spaceTitle">把每一天，过成我们的纪念日</h1>
        <p class="space-subtitle">收好心动、记下日常，也把想说的话留给彼此。</p>
        <div class="space-couple-line">
          <span class="space-avatar avatar-cat" data-slot="cat" aria-label="小猫"></span>
          <span class="space-connection"><i></i><b>♡</b><i></i></span>
          <span class="space-avatar avatar-fish" data-slot="fish" aria-label="小鱼"></span>
        </div>
        <p class="space-days">今天也是一起走过的第 <strong>1</strong> 天</p>
      </section>

      <section class="space-tools" aria-label="情侣空间功能">
        <div class="space-section-heading"><span>我们的日常</span><small>SPACE 01</small></div>
        <div class="space-tool-grid">
          <button class="space-tool space-tool-primary" id="openLetter" type="button">
            <span class="tool-icon tool-icon-letter">✉</span>
            <span class="tool-copy"><b>写给你的信</b><small>把心里话交给你</small></span>
            <span class="tool-arrow">→</span>
          </button>
          <button class="space-tool" type="button" data-space-tool="memories">
            <span class="tool-icon tool-icon-memory">✦</span>
            <span class="tool-copy"><b>我们的回忆</b><small>照片和故事正在收集</small></span>
            <span class="tool-arrow">→</span>
          </button>
          <button class="space-tool" type="button" data-space-tool="calendar">
            <span class="tool-icon tool-icon-calendar">♡</span>
            <span class="tool-copy"><b>恋爱日历</b><small>重要日子不会忘记</small></span>
            <span class="tool-arrow">→</span>
          </button>
          <button class="space-tool" type="button" data-space-tool="wishes">
            <span class="tool-icon tool-icon-wish">✧</span>
            <span class="tool-copy"><b>想和你一起</b><small>把未来写进清单</small></span>
            <span class="tool-arrow">→</span>
          </button>
        </div>
      </section>
    </main>
    <button class="bubu-pet" id="bubuPet" type="button" aria-label="和布布互动" title="和布布互动">
      <span class="bubu-pet-glow" aria-hidden="true"></span>
      <img id="bubuImage" src="assets/bubu-idle.gif" alt="布布" loading="eager" decoding="async" draggable="false">
      <span class="bubu-pet-note" aria-hidden="true">布布陪着你</span>
    </button>
    <div class="bubu-action-chip" id="bubuActionChip" aria-live="polite">安静待机</div>
    <div class="bubu-countdown" id="bubuCountdown" hidden aria-live="polite">
      <span id="bubuCountdownMode">专注</span>
      <strong id="bubuCountdownClock">25:00</strong>
    </div>
    <div class="bubu-note-widget" id="bubuNoteWidget" hidden>
      <span class="bubu-note-pin">♡</span>
      <p id="bubuNoteText"></p>
      <button type="button" id="bubuNoteClose" aria-label="收起便签" title="收起便签">×</button>
    </div>
    <section class="bubu-feature-panel" id="bubuFeaturePanel" hidden aria-label="布布功能栏">
      <header class="bubu-panel-head">
        <div>
          <span class="bubu-panel-kicker">BUBU ROOM</span>
          <h2 id="bubuPanelTitle">布布动作库</h2>
        </div>
        <button class="bubu-panel-close" id="bubuPanelClose" type="button" aria-label="关闭功能栏" title="关闭功能栏">×</button>
      </header>
      <div class="bubu-panel-tabs" role="tablist" aria-label="布布功能">
        <button type="button" data-bubu-panel="actions">动作</button>
        <button type="button" data-bubu-panel="notes">便签</button>
        <button type="button" data-bubu-panel="timer">番茄钟</button>
        <button type="button" data-bubu-panel="reminders">提醒</button>
        <button type="button" data-bubu-panel="shortcuts">快捷</button>
        <button type="button" data-bubu-panel="settings">设置</button>
      </div>
      <div class="bubu-panel-body" id="bubuPanelBody"></div>
    </section>
    <div class="bubu-context" id="bubuContext" hidden role="menu" aria-label="布布菜单">
      <button type="button" data-bubu-panel="actions">动作库</button>
      <button type="button" data-bubu-panel="notes">便签</button>
      <button type="button" data-bubu-panel="timer">番茄钟</button>
      <button type="button" data-bubu-panel="settings">设置</button>
    </div>
    <nav class="space-nav" aria-label="空间导航">
      <button class="space-nav-item is-active" type="button"><span>⌂</span><small>首页</small></button>
      <button class="space-nav-item" type="button" data-space-tool="memories"><span>♡</span><small>回忆</small></button>
      <button class="space-nav-item" type="button" data-space-tool="wishes"><span>✦</span><small>愿望</small></button>
      <button class="space-nav-item" type="button" data-space-tool="settings"><span>···</span><small>更多</small></button>
    </nav>
    <div class="space-toast" id="spaceToast" role="status" aria-live="polite"></div>
  </section>

  <button id="sound" class="sound is-off" type="button" aria-label="打开声音" title="声音">
    <svg class="ico-mute" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h3l5-4v14l-5-4H4z"/>
      <path d="M16 9l5 6M21 9l-5 6" class="ico-x"/>
    </svg>
    <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9h3l5-4v14l-5-4H4z"/>
      <path d="M15.6 8.6a5 5 0 0 1 0 6.8M18.2 6.2a8.5 8.5 0 0 1 0 11.6" class="ico-wave"/>
    </svg>
  </button>

  <!-- 第一幕：信封 -->
  <section class="scene scene-envelope" id="scene-envelope">
    <button class="space-back" id="spaceBack" type="button" aria-label="返回情侣空间" title="返回情侣空间">←</button>
    <p class="intro-line" id="introLine">写给你的一封信</p>

    <!-- 卡通小鱼（信封右上，会摆尾吐泡） -->
    <div class="mascot mascot-fish" id="mascotFishEnvelope" aria-hidden="true">
      <span class="bubbles" data-slot="bubbles"></span>
      <div class="swim" data-slot="fish"></div>
    </div>

    <div class="env-wrap" id="envWrap">
      <div class="env" id="env" role="img" aria-label="一封信">
        <div class="env-back"></div>
        <div class="env-letter" id="envLetter">
          <div class="mini-note">
            <span class="mini-heart"></span>
            <span id="miniNote">只给你看</span>
          </div>
        </div>
        <div class="env-body">
          <div class="env-pocket"></div>
        </div>
        <div class="env-flap" id="envFlap">
          <div class="env-flap-inner"></div>
        </div>
        <button class="env-seal" id="envSeal" type="button" aria-label="打开信封">
          <span class="seal-glow" aria-hidden="true"></span>
          <span class="seal-icon" id="sealIcon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><path d="M16 28.4C6.7 21.9 2 16.6 2 11.2 2 6.9 5.3 4 9.2 4c2.6 0 5 1.4 6.8 4.1C17.8 5.4 20.2 4 22.8 4 26.7 4 30 6.9 30 11.2c0 5.4-4.7 10.7-14 17.2z"/></svg>
          </span>
        </button>
      </div>

      <!-- 卡通小猫（从信封左下探出头，会眨眼摇尾） -->
      <div class="mascot mascot-cat" id="mascotCat" aria-hidden="true">
        <div class="peek" data-slot="cat"></div>
      </div>
    </div>

    <p class="hint" id="envHint">轻触这里，打开信封</p>
  </section>

  <!-- 第二幕：信纸 -->
  <section class="paper" id="paper" role="dialog" aria-modal="true" aria-label="写给你的信" hidden>
    <header class="paper-head">
      <span class="stage-tag"><b id="stageNo">01</b><i>/</i><span id="stageTotal">04</span></span>
      <span class="stage-name" id="stageName">启封</span>
      <button class="paper-close" id="paperClose" type="button" aria-label="收好这封信">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="paper-scroll" id="paperScroll">
      <h1 class="paper-title" id="letterTitle"></h1>
      <!-- 每一幕的小陪读：小猫和小鱼轮流出场，点一下有反应 -->
      <div class="paper-mascot" id="paperMascot" aria-hidden="true">
        <span class="pm-fish" data-slot="fish"></span>
        <span class="pm-heart" data-slot="heart"></span>
        <span class="pm-cat" data-slot="cat"></span>
      </div>
      <div class="paper-body" id="letterBody"></div>
      <div class="paper-body paper-body-2" id="letterBody2"></div>
      <div class="paper-end" id="letterEnd">
        <p class="sign" id="letterSign"></p>
        <div class="big-heart" id="bigHeart">
          <div class="duo" aria-hidden="true">
            <span class="duo-cat" data-slot="cat"></span>
            <span class="duo-heart" data-slot="heart"></span>
            <span class="duo-fish" data-slot="fish"></span>
          </div>
          <span class="tap-hint-word">轻触重新看一遍</span>
        </div>
      </div>
    </div>
    <div class="paper-actions">
      <button class="paper-skip" id="paperSkip" type="button" hidden>继续</button>
    </div>
  </section>

  <!-- 副幕：视频全屏 -->
  <section class="cine" id="cine" hidden>
    <div class="cine-inner">
      <video id="cineVideo" playsinline webkit-playsinline x5-playsinline preload="metadata" muted loop></video>
      <button class="cine-play" id="cinePlay" type="button" aria-label="播放">
        <svg viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>
      </button>
      <button class="cine-skip" id="cineSkip" type="button">跳过</button>
      <p class="cine-tip">轻触画面播放 · 右上角可跳过</p>
    </div>
  </section>

  <div class="veil" id="veil" hidden></div>
</div>

<script src="config.js"></script>
<script src="app.js" defer></script>
</body>
</html>
